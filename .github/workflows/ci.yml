name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: true
      REQUEST_SIGNING_SECRET: test-signing-secret
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      FB_ADMIN_CREDENTIALS: eyJwcm9qZWN0X2lkIjoiZGVtby1wcm9qZWN0In0=
      GOOGLE_PLACES_API_KEY: dummy-key
      OPENROUTER_API_KEY: dummy-key
      VITE_FIREBASE_API_KEY: dummy-key
      VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: dummy-project
      VITE_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: 1:123:web:abc
      VITE_API_URL: http://localhost:8000/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            travel-app-fe/package-lock.json
            travel-app-be/package-lock.json

      - name: Verify root lockfile
        run: npm ci

      - name: Install frontend dependencies
        working-directory: travel-app-fe
        run: npm ci

      - name: Frontend tests
        working-directory: travel-app-fe
        run: npm test

      - name: Frontend dependency audit
        working-directory: travel-app-fe
        run: npm audit --audit-level=high

      - name: Frontend build
        working-directory: travel-app-fe
        run: npm run build

      - name: Install backend dependencies
        working-directory: travel-app-be
        run: npm ci

      - name: Backend tests
        working-directory: travel-app-be
        run: npm test

      - name: Backend dependency audit
        working-directory: travel-app-be
        run: npm audit --audit-level=high

      - name: Install pinned Firebase CLI
        run: npm install -g firebase-tools@15.28.2

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Hosting emulator assets
        run: bash scripts/prepare-hosting.sh

      - name: Firebase Emulator integration smoke tests
        run: npm run test:emulators
